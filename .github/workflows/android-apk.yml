name: Build Staff Portal APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build installable release APK
        run: gradle :android-app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WTS-Staff-Portal-v2.1.0
          path: android-app/build/outputs/apk/release/android-app-release.apk
