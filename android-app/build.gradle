plugins {
    id "com.android.application"
}

android {
    namespace "com.waytosuccess.staffportal"
    compileSdk 35

    defaultConfig {
        applicationId "com.waytosuccess.staffportal"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "2.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Internal school distribution: Gradle's installable signature is
            // used until the school provides its long-term Play signing key.
            signingConfig signingConfigs.debug
        }
    }
}
