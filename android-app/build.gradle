plugins {
    id "com.android.application"
}

android {
    namespace "com.waytosuccess.staffportal"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.waytosuccess.staffportal"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "2.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Internal school distribution: Gradle's installable signature is
            // used until the school provides its long-term Play signing key.
            signingConfig signingConfigs.debug
        }
    }
}
